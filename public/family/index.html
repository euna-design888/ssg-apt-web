<style>
:root{--bg:#141312;--surface:#1d1b1a;--card:#211f1e;--card-2:#2b2a28;--line:#59413b;--text:#e6e1df;--mute:#e0bfb7;--sub:#a88a83;--primary:#ffb4a1;--accent:#ef6540;--gold:#fabc4d;--on-accent:#3c0800}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,system-ui,"Malgun Gothic",sans-serif;font-size:17px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;padding-block:0 calc(40px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
h1,h2{font-family:"Noto Serif KR",serif;letter-spacing:-.01em;margin:0}

.lead{color:var(--mute);margin:0;font-size:16px}

.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--mute);text-decoration:none;font-size:15px;font-weight:700;border:1px solid var(--line)}
.tab.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--card-2);color:var(--gold);width:fit-content}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
label.f{display:block;font-size:15px;font-weight:700;color:var(--mute);margin-bottom:6px}
input[type=text],input[type=date],select{width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:17px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg label{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--mute);font-weight:700;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--card-2);color:var(--primary);border-color:var(--accent)}
.row{display:flex;flex-direction:column;gap:14px}
.check{display:flex;align-items:center;gap:8px;font-size:16px;color:var(--mute);min-height:44px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font:inherit;font-size:18px;font-weight:800;cursor:pointer;text-decoration:none;text-align:center}

.foot a{color:var(--mute)}

<body>
<div class="wrap">
  <nav class="tabs" aria-label="사주 서비스 목록">

  <header>
    <span class="tag">2027 정미년 · 무료</span>
    <h1 style="margin-top:10px">생년월일만 넣으면<br>내 사주 명식이 나와요</h1>
    <p class="lead" style="margin-top:8px">네 기둥(년·월·일·시), 일간 성향, 오행 분포, 띠를 결과 페이지에서 볼 수 있어요.</p>
  </header>

  <section class="card" aria-label="사주 입력">
    <form id="form" class="row" novalidate>
      <div>
        <label class="f" for="name">이름 (선택)</label>
        <input type="text" id="name" maxlength="8" placeholder="예: 홍길동" autocomplete="off">
      </div>
      <div>
        <span class="f" id="calLabel">달력</span>
        <div class="seg" role="radiogroup" aria-labelledby="calLabel">
          <label><input type="radio" name="cal" value="solar" checked> 양력</label>
          <label><input type="radio" name="cal" value="lunar"> 음력</label>
        </div>
        <label class="check"><input type="checkbox" id="leap"> 음력 윤달이에요</label>
      </div>
      <div>
        <label class="f" for="birth">생년월일</label>
        <input type="date" id="birth" required>
      </div>
      <div>
        <label class="f" for="hour">태어난 시간</label>
        <select id="hour">
          <option value="-1">시간 모름</option>
          <option value="0">자시 (00:00~01:29)</option>
          <option value="1">축시 (01:30~03:29)</option>
          <option value="2">인시 (03:30~05:29)</option>
          <option value="3">묘시 (05:30~07:29)</option>
          <option value="4">진시 (07:30~09:29)</option>
          <option value="5">사시 (09:30~11:29)</option>
          <option value="6">오시 (11:30~13:29)</option>
          <option value="7">미시 (13:30~15:29)</option>
          <option value="8">신시 (15:30~17:29)</option>
          <option value="9">유시 (17:30~19:29)</option>
          <option value="10">술시 (19:30~21:29)</option>
          <option value="11">해시 (21:30~23:29)</option>
          <option value="12">자시 (23:30~24:00)</option>
        </select>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit">내 사주 보기</button>
    </form>
  </section>

  <p class="foot">재미로 보는 콘텐츠예요. 사주 계산은 한국천문연구원 음력·절기 자료를 기준으로 하는 만세력(ssaju)으로 해요.<br>입력한 생일은 서버로 보내지 않고 이 기기 브라우저에서만 쓰여요. · <a href="/privacy">개인정보처리방침</a></p>
</div>

<script>
// 입력값은 이 탭의 sessionStorage에만 두고 결과 페이지(saju.html)로 넘김. 주소창에는 넣지 않음
document.getElementById('form').addEventListener('submit',e=>{
  e.preventDefault();
  const err=document.getElementById('err');
  err.textContent='';
  const date=document.getElementById('birth').value;
  if(!date){err.textContent='생년월일을 넣어 주세요';return}
  const v={name:document.getElementById('name').value.trim().slice(0,8),cal:document.querySelector('input[name=cal]:checked').value,leap:document.getElementById('leap').checked,date,hour:Number(document.getElementById('hour').value)};
  try{sessionStorage.setItem('saju_input',JSON.stringify(v))}catch(_){}
  location.href='saju.html';
});
</script>
